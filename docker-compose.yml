services:
  postgres:
    image: postgres:16-alpine
    container_name: doodle-duel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doodleduel}
      POSTGRES_USER: ${POSTGRES_USER:-doodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doodlepass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doodle} -d ${POSTGRES_DB:-doodleduel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doodle-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doodle-duel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-doodleduel}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-doodle}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-doodlepass}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-doodleduel-super-secret-jwt-signing-key-with-at-least-256-bits-length!}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - doodle-net

volumes:
  postgres_data:

networks:
  doodle-net:
    driver: bridge
