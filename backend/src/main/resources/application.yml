server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: doodle-duel-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DATABASE_USERNAME:postgres.mpkppepwijhzehavfizh}
    password: ${DATABASE_PASSWORD:X2qouCicVYWb1DL3}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:doodleduel-super-secret-jwt-signing-key-with-at-least-256-bits-length!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}
  game:
    min-players-to-start: 2
    default-round-seconds: 60
    base-guess-score: 200
    first-guess-bonus: 100
    drawer-bonus-per-guess: 50
    drawer-max-bonus: 250
