server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: doodle-duel-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:doodleduel}
    username: ${DB_USER:doodle}
    password: ${DB_PASSWORD:doodlepass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:doodleduel-super-secret-jwt-signing-key-with-at-least-256-bits-length!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}
  game:
    min-players-to-start: 2
    default-round-seconds: 60
    base-guess-score: 200
    first-guess-bonus: 100
    drawer-bonus-per-guess: 50
    drawer-max-bonus: 250
