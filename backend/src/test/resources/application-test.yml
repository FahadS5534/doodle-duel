server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:doodleduel_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: doodleduel-super-secret-jwt-signing-key-with-at-least-256-bits-length!
    expiration-ms: 3600000
  cors:
    allowed-origins: "*"
  game:
    min-players-to-start: 2
    default-round-seconds: 60
    base-guess-score: 200
    first-guess-bonus: 100
    drawer-bonus-per-guess: 50
    drawer-max-bonus: 250
