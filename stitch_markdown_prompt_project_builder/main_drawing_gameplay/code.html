<script>
  // Simple Micro-interaction Script for Interactive Feedback
  function setStroke(size, element) {
    const parent = element.parentElement;
    parent.querySelectorAll('button').forEach(btn => {
      btn.classList.remove('bg-surface-canvas', 'shadow-sm');
      const dot = btn.querySelector('div');
      if (dot) dot.classList.replace('bg-primary-coral', 'bg-text-secondary');
    });
    element.classList.add('bg-surface-canvas', 'shadow-sm');
    const activeDot = element.querySelector('div');
    if (activeDot) activeDot.classList.replace('bg-text-secondary', 'bg-primary-coral');
  }

  // Live Timer Countdown Simulation
  let remainingSeconds = 42;
  const timerDisplay = document.getElementById('game-timer');
  const timerInterval = setInterval(() => {
    if (remainingSeconds > 0) {
      remainingSeconds--;
      const formatted = remainingSeconds < 10 ? `0:0${remainingSeconds}` : `0:${remainingSeconds}`;
      if (timerDisplay) timerDisplay.textContent = formatted;
    } else {
      clearInterval(timerInterval);
    }
  }, 1000);
